# Aktualisiert stau-info.nl alle 5 Minuten mit frischen NDW-Verkehrsdaten.
# Taktgeber ist der Cloudflare-Worker in trigger/ (workflow_dispatch alle 5 Minuten);
# der GitHub-Zeitplan unten ist nur eine Rückfallebene, falls der Worker ausfällt.
# Holt den Seiteninhalt aus dem privaten Repo (nur Lesezugriff), baut die Seite
# und veröffentlicht sie auf Cloudflare. Es werden keine Inhalte in diesem Repo gespeichert,
# und die Build-Ausgabe wird nicht ins öffentliche Log geschrieben.
#
# Secrets: CONTENT_REPO_TOKEN (Fine-grained Token, nur „Contents: Read“ auf EhsanBatt/stau-info-nl),
#          CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Live-Daten

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: live-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'EhsanBatt/stau-info-nl-live'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inhalt aus privatem Repo holen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: EhsanBatt/stau-info-nl
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Bauen (Ausgabe bleibt privat)
        env:
          STRICT_DATA: "1"
        run: |
          npm ci --no-audit --no-fund > /tmp/build.log 2>&1 || { echo "npm ci fehlgeschlagen"; exit 1; }
          npm run build >> /tmp/build.log 2>&1 || { echo "Build fehlgeschlagen (Details im privaten Repo lokal prüfen)"; exit 1; }
          echo "Build erfolgreich."

      - name: Auf Cloudflare veröffentlichen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Bis zu 3 Versuche: einzelne Cloudflare-API-Aussetzer sollen den Lauf nicht scheitern lassen.
        # Bei Fehlern werden nur Wranglers [ERROR]-Zeilen gezeigt, keine Build-Ausgabe.
        run: |
          for i in 1 2 3; do
            if npx wrangler deploy > /tmp/deploy.log 2>&1; then
              echo "Veröffentlicht (Versuch $i)."
              exit 0
            fi
            echo "Deploy-Versuch $i fehlgeschlagen:"
            grep -E "\[ERROR\]|APIError" /tmp/deploy.log | head -5 || true
            if [ "$i" -lt 3 ]; then sleep $((i * 15)); fi
          done
          echo "Deploy fehlgeschlagen"
          exit 1
