# GitHub schaltet Zeitpläne in öffentlichen Repos nach 60 Tagen ohne Aktivität ab.
# Dieser Job macht einmal im Monat einen leeren Commit, damit der 5-Minuten-Zeitplan weiterläuft.
name: Zeitplan aktiv halten

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    if: github.repository == 'EhsanBatt/stau-info-nl-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Zeitplan aktiv halten"
          git push
